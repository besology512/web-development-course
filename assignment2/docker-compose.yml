version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: ghost-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:latest
    container_name: ghost-redis
    ports:
      - "6379:6379"
    command: redis-server --notify-keyspace-events Ex
    volumes:
      - redis_data:/data

volumes:
  mongodb_data:
  redis_data:
